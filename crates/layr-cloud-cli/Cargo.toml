[package]
name = "layr-cloud-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "layr-cloud"
path = "src/main.rs"

[dependencies]
layr-store = { git = "https://github.com/ifdotpy/layr", rev = "6c2386e6e9ec5fdc3a2676c1529b66b9c0c5edbd" }
anyhow = "1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
