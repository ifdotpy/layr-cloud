[package]
name = "layr-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
layr-store = { git = "https://github.com/ifdotpy/layr", rev = "466f120f0846da86f63028bbec9eabb2fa69581f", default-features = false, features = ["wasm"] }
layr-model = { git = "https://github.com/ifdotpy/layr", rev = "466f120f0846da86f63028bbec9eabb2fa69581f" }
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
zeroize = "1"
similar = "2"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
zstd = "0.13"
sha2 = "0.10"

[features]
test-tools = ["layr-store/native", "dep:reqwest"]

[[example]]
name = "upload_gateway"
required-features = ["test-tools"]
