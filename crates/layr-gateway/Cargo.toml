[package]
name = "layr-gateway"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
layr-store = { git = "https://github.com/ifdotpy/layr", rev = "ddcce2301e5b4d4a15e9f5d42b5bd5c5ffc4f0fd" }
anyhow = "1"
age = "0.11"
base64 = "0.22"
bech32 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
hmac = "0.12"
rand = "0.8"
regex = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustix = { version = "1", features = ["fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

socket2 = "0.6"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
uuid = { version = "1", features = ["v7"] }
