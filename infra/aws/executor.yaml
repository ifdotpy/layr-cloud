AWSTemplateFormatVersion: '2010-09-09'
Description: Layr executor or idle-stopping check runner, IPv6 Graviton and retained btrfs data.
Parameters:
  HostKind:
    Type: String
    Default: executor
    AllowedValues: [executor, runner]
  RunnerInstanceId:
    Type: String
    Default: ''
    AllowedPattern: '(i-[0-9a-f]{17})?'
    Description: Exact runner instance this executor can start; empty on the runner itself.
  RootVolumeSize:
    Type: Number
    Default: 12
    MinValue: 8
  RustToolchain:
    Type: String
    Default: 1.99.1
    AllowedPattern: '[0-9]+\.[0-9]+\.[0-9]+'
  ArtifactsBucket:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: Debian 13 ARM64 AMI with cloud-init.
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: IPv6-only gateway subnet with an IPv6 internet route.
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability zone of SubnetId.
  TailnetHostname:
    Type: String
    Default: layr-executor
    AllowedPattern: '[a-z0-9][a-z0-9-]{0,62}'
  RoleName:
    Type: String
    Default: layr-executor
    AllowedPattern: '[A-Za-z0-9+=,.@_-]{1,64}'
  ReaderRoleArn:
    Type: String
  WriterRoleArn:
    Type: String
  AdditionalStoreRoleArns:
    Type: CommaDelimitedList
    Default: ''
    Description: Additional exact reader and writer role ARNs for other enrolled projects.
  ProjectWriteTokenParameterArns:
    Type: CommaDelimitedList
    Default: ''
    AllowedPattern: '(|arn:aws:ssm:[a-z0-9-]+:[0-9]{12}:parameter/layr-store/executor/projects/[A-Za-z0-9][A-Za-z0-9_-]{0,43}/write-token)'
    Description: Exact SSM parameter ARNs of the enrolled projects, without wildcards.
  WriteTokenParameter:
    Type: String
    AllowedPattern: '/[A-Za-z0-9_./-]+'
    Default: /layr-store/executor/write-token
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.medium, t4g.large, t4g.xlarge, t4g.2xlarge]
  DataVolumeSize:
    Type: Number
    Default: 100
    MinValue: 10
    MaxValue: 16384
Rules:
  RunnerCannotWakeAnotherHost:
    Assertions:
      - Assert: !Or [!Equals [!Ref HostKind, executor], !Equals [!Ref RunnerInstanceId, '']]
        AssertDescription: Set RunnerInstanceId only on the executor, never on a runner.
Conditions:
  HasRunner: !Not [!Equals [!Ref RunnerInstanceId, '']]
  HasAdditionalStores: !Not [!Equals [!Join ['', !Ref AdditionalStoreRoleArns], '']]
  HasProjectTokens: !Not [!Equals [!Join ['', !Ref ProjectWriteTokenParameterArns], '']]
Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Layr executor, outbound connections and SSM only
      VpcId: !Ref VpcId
      SecurityGroupIngress: []
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIpv6: '::/0'
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"]
      Policies:
        - PolicyName: executor
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactsBucket}/executor/*'
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: [!Ref ReaderRoleArn, !Ref WriterRoleArn]
              - !If
                - HasAdditionalStores
                - Effect: Allow
                  Action: sts:AssumeRole
                  Resource: !Ref AdditionalStoreRoleArns
                - !Ref AWS::NoValue
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !If
                  - HasProjectTokens
                  - !Split [',', !Join [',', [!Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${WriteTokenParameter}', !Join [',', !Ref ProjectWriteTokenParameterArns]]]]
                  - [!Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${WriteTokenParameter}']
              - Effect: Deny
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                NotResource: !If
                  - HasProjectTokens
                  - !Split [',', !Join [',', [!Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${WriteTokenParameter}', !Join [',', !Ref ProjectWriteTokenParameterArns]]]]
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${WriteTokenParameter}'
              - !If
                - HasRunner
                - Effect: Allow
                  Action: ec2:StartInstances
                  Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${RunnerInstanceId}'
                  Condition:
                    StringEquals:
                      ec2:ResourceTag/layr:kind: runner
                - !Ref AWS::NoValue
              - !If
                - HasRunner
                - Effect: Allow
                  Action: ec2:DescribeInstances
                  Resource: '*'
                - !Ref AWS::NoValue
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref Role]
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      VolumeType: gp3
      Size: !Ref DataVolumeSize
      Encrypted: true
      Tags: [{Key: Name, Value: !Sub '${RoleName}-store'}]
  DataAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref Instance
      VolumeId: !Ref DataVolume
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      InstanceInitiatedShutdownBehavior: stop
      CreditSpecification:
        CPUCredits: standard
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref SecurityGroup]
          Ipv6AddressCount: 1
          AssociatePublicIpAddress: false
      MetadataOptions:
        HttpEndpoint: enabled
        HttpProtocolIpv6: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - {Key: Name, Value: !Ref RoleName}
        - {Key: 'layr:kind', Value: !Ref HostKind}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          umask 022
          export DEBIAN_FRONTEND=noninteractive
          for try in 1 2 3 4 5; do apt-get update && break || sleep 15; done
          apt-get install -y --no-install-recommends ca-certificates curl python3-boto3 \
            btrfs-progs git zstd util-linux unattended-upgrades bubblewrap
          if [ '${HostKind}' = runner ]; then
            apt-get install -y --no-install-recommends xfsprogs e2fsprogs python3 \
              docker-registry skopeo apache2-utils golang-go build-essential pkg-config
          fi
          if ! id -u layr-registry >/dev/null 2>&1; then
            useradd --system --user-group --no-create-home --home-dir /nonexistent \
              --shell /usr/sbin/nologin layr-registry
          fi
          test "$(id -u layr-registry)" -ne 0
          if ! id -u layr-checks >/dev/null 2>&1; then
            useradd --system --user-group --create-home --home-dir /var/lib/layr-checks \
              --shell /usr/sbin/nologin layr-checks
          fi
          mkdir -p /etc/amazon/ssm
          cat > /etc/amazon/ssm/amazon-ssm-agent.json <<'EOF'
          {"Agent":{"UseDualStackEndpoint":true}}
          EOF
          curl -fSsL --retry 5 https://s3.dualstack.${AWS::Region}.amazonaws.com/amazon-ssm-${AWS::Region}/latest/debian_arm64/amazon-ssm-agent.deb -o /tmp/amazon-ssm-agent.deb
          dpkg -i /tmp/amazon-ssm-agent.deb
          rm /tmp/amazon-ssm-agent.deb
          systemctl enable --now amazon-ssm-agent
          cat > /etc/apt/apt.conf.d/52layr-executor <<'EOF'
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "04:30";
          EOF
          install -d -m 0755 /etc/layr-executor
          cat > /etc/layr-executor/source.json <<'EOF'
          {"kind":"executor","hostKind":"${HostKind}","tailnetTag":"tag:layr-${HostKind}","runnerInstanceId":"${RunnerInstanceId}","hostname":"${TailnetHostname}","bucket":"${ArtifactsBucket}","region":"${AWS::Region}","network":"public-ipv6","writeTokenParameter":"${WriteTokenParameter}"}
          EOF
          cat > /usr/local/lib/layr-executor-token.py <<'EOF'
          import json, os, sys, tempfile, subprocess
          from pathlib import Path
          os.environ['AWS_EC2_METADATA_SERVICE_ENDPOINT_MODE'] = 'IPv6'
          os.environ['AWS_USE_DUALSTACK_ENDPOINT'] = 'true'
          import boto3
          try:
              source = json.load(open('/etc/layr-executor/source.json'))
              value = boto3.client('ssm', region_name=source['region']).get_parameter(
                  Name=source['writeTokenParameter'], WithDecryption=True)['Parameter']['Value']
              root = Path('/run/layr-executor-token')
              if root.is_symlink() or not root.is_dir() or root.stat().st_uid != 0:
                  raise ValueError('invalid runtime directory')
              if subprocess.check_output(['findmnt', '-n', '-o', 'FSTYPE', '-T', str(root)], text=True).strip() != 'tmpfs':
                  raise ValueError('runtime directory must be on tmpfs')
              with tempfile.NamedTemporaryFile('w', dir=root, delete=False) as token:
                  temporary = token.name
                  os.fchmod(token.fileno(), 0o600)
                  token.write(value)
              os.replace(temporary, root / 'write-token')
          except Exception:
              sys.exit('executor token setup failed; check SSM parameter and instance role')
          EOF
          cat > /etc/systemd/system/layr-executor-token.service <<'EOF'
          [Unit]
          Description=Load the executor write token into tmpfs
          After=network-online.target
          Wants=network-online.target
          PartOf=layr.service
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          RuntimeDirectory=layr-executor-token
          RuntimeDirectoryMode=0700
          ExecStart=/usr/bin/python3 /usr/local/lib/layr-executor-token.py
          ExecStop=/bin/rm -f /run/layr-executor-token/write-token
          EOF
          cat > /usr/local/sbin/layr-data <<'EOF'
          #!/bin/bash
          set -euo pipefail
          serial=$(echo '${DataVolume}' | tr -d '-')
          device=''
          for try in $(seq 1 120); do
            device=$(lsblk -dpno NAME,SERIAL | awk -v serial="$serial" '$2 == serial {print $1}')
            [ -n "$device" ] && break
            sleep 2
          done
          test -b "$device"
          type=$(blkid -p -s TYPE -o value "$device" || true)
          if [ -z "$type" ]; then
            # Refuse a partition table or any other signature. Never use mkfs -f.
            test -z "$(wipefs --noheadings --output TYPE "$device")"
            test "$(lsblk -nrpo NAME "$device" | wc -l)" -eq 1
            mkfs.btrfs "$device"
          else
            test "$type" = btrfs
          fi
          uuid=$(blkid -s UUID -o value "$device")
          mkdir -p /var/lib/layr
          if mountpoint -q /var/lib/layr; then
            test "$(findmnt -nro UUID -T /var/lib/layr)" = "$uuid"
          else
            mount -t btrfs -o compress=zstd "UUID=$uuid" /var/lib/layr
          fi
          chmod 0755 /var/lib/layr
          EOF
          if [ '${HostKind}' = runner ]; then
            cat >> /usr/local/sbin/layr-data <<'EOF'
          mkdir -p /var/lib/layr/check-work
          if ! mountpoint -q /var/tmp; then
            mount --bind /var/lib/layr/check-work /var/tmp
          fi
          chmod 1777 /var/tmp
          mkdir -p /var/lib/layr/tools/cargo /var/lib/layr/tools/rustup /usr/local/share/layr-checks
          if ! mountpoint -q /usr/local/share/layr-checks; then
            mount --bind /var/lib/layr/tools /usr/local/share/layr-checks
          fi
          EOF
          fi
          chmod 0755 /usr/local/sbin/layr-data
          cat > /etc/systemd/system/layr-data.service <<'EOF'
          [Unit]
          Description=Mount the Layr btrfs data volume
          After=systemd-udev-settle.service
          Wants=systemd-udev-settle.service
          Before=layr.service
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/sbin/layr-data
          TimeoutStartSec=5min
          [Install]
          WantedBy=multi-user.target
          EOF
          cat > /etc/systemd/system/layr.service <<'EOF'
          [Unit]
          Description=Layr service
          Requires=layr-data.service layr-executor-token.service
          After=layr-data.service layr-executor-token.service network-online.target
          Wants=network-online.target
          ConditionPathExists=/etc/layr-executor/ready
          [Service]
          Environment=LAYR_ROOT=/var/lib/layr
          Environment=LAYR_GATEWAY_TOKEN_FILE=/run/layr-executor-token/write-token
          Environment=AWS_EC2_METADATA_SERVICE_ENDPOINT_MODE=IPv6
          Environment=AWS_USE_DUALSTACK_ENDPOINT=true
          ExecStart=/opt/layr-executor/current/layr daemon --socket /run/layr.sock --tick 60
          Restart=on-failure
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          EOF
          cat > /usr/local/sbin/layr-executor-transfer <<'EOF'
          #!/bin/bash
          set -euo pipefail
          source /etc/layr-executor/profile.env
          export LAYR_ROOT=/var/lib/layr
          /opt/layr-executor/current/layr --project "$PROJECT" fetch origin
          if [ '${HostKind}' = executor ]; then
            /opt/layr-executor/current/layr --project "$PROJECT" requests apply --remote origin --json >/dev/null
          fi
          /opt/layr-executor/current/layr --project "$PROJECT" push origin
          if [ '${HostKind}' = executor ]; then
            /opt/layr-executor/current/layr --project "$PROJECT" index write origin
          fi
          EOF
          chmod 0755 /usr/local/sbin/layr-executor-transfer
          cat > /etc/systemd/system/layr-transfer.service <<'EOF'
          [Unit]
          Description=Fetch and push the executor project
          Requires=layr.service
          After=layr.service
          ConditionPathExists=/etc/layr-executor/ready
          ConditionPathExists=!/etc/layr-executor/checks-ready
          [Service]
          Type=oneshot
          Environment=LAYR_GATEWAY_TOKEN_FILE=/run/layr-executor-token/write-token
          ExecStartPre=/usr/bin/python3 /usr/local/lib/layr-executor-token.py
          ExecStart=/usr/local/sbin/layr-executor-transfer
          TimeoutStartSec=1h
          EOF
          cat > /etc/systemd/system/layr-transfer.timer <<'EOF'
          [Timer]
          OnBootSec=2min
          OnUnitInactiveSec=1min
          RandomizedDelaySec=15s
          [Install]
          WantedBy=timers.target
          EOF
          systemctl daemon-reload
          systemctl enable layr-data.service
          systemctl enable layr.service
          systemctl enable --now layr-transfer.timer
          cat > /etc/systemd/system/layr-checks.service <<'EOF'
          [Unit]
          Description=Sync and scan local Layr checks
          Requires=layr.service
          After=layr.service
          ConditionPathExists=/etc/layr-executor/checks-ready
          [Service]
          Type=oneshot
          Environment=AWS_EC2_METADATA_SERVICE_ENDPOINT_MODE=IPv6
          Environment=AWS_USE_DUALSTACK_ENDPOINT=true
          ExecStartPre=/usr/bin/python3 /usr/local/lib/layr-executor-token.py
          ExecStart=/usr/bin/python3 /opt/layr-executor/current/checks.py tick
          TimeoutStartSec=0
          EOF
          cat > /etc/systemd/system/layr-checks.timer <<'EOF'
          [Timer]
          OnBootSec=3min
          OnUnitInactiveSec=60s
          [Install]
          WantedBy=timers.target
          EOF
          cat > /etc/systemd/system/layr-runner-idle.service <<'EOF'
          [Unit]
          Description=Stop the check runner after thirty idle minutes
          [Service]
          Type=oneshot
          ExecStart=/usr/bin/python3 /opt/layr-executor/current/checks.py idle
          EOF
          cat > /etc/systemd/system/layr-runner-idle.timer <<'EOF'
          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=1min
          [Install]
          WantedBy=timers.target
          EOF
          systemctl daemon-reload
          systemctl enable --now layr-checks.timer
          export AWS_EC2_METADATA_SERVICE_ENDPOINT_MODE=IPv6 AWS_USE_DUALSTACK_ENDPOINT=true
          cat > /usr/local/lib/layr-cloud-bootstrap.py <<'EOF'
          import hashlib, io, json, os, re, sys, tarfile, tempfile
          from pathlib import Path
          os.environ['AWS_EC2_METADATA_SERVICE_ENDPOINT_MODE'] = 'IPv6'
          os.environ['AWS_USE_DUALSTACK_ENDPOINT'] = 'true'
          import boto3
          source = json.load(open(sys.argv[1]))
          s3 = boto3.client('s3', region_name=source['region'])
          kind = source['kind']
          release = json.load(s3.get_object(Bucket=source['bucket'], Key=kind+'/release.json')['Body'])
          digest = release['sha256']
          if not re.fullmatch('[0-9a-f]{64}', digest) or release['key'] != kind+'/releases/'+digest+'.tgz':
              raise ValueError('invalid release manifest')
          data = s3.get_object(Bucket=source['bucket'], Key=release['key'])['Body'].read()
          if hashlib.sha256(data).hexdigest() != digest:
              raise ValueError('release SHA-256 mismatch')
          archive = tarfile.open(fileobj=io.BytesIO(data))
          member = archive.getmember('./sync.py')
          if not member.isfile():
              raise ValueError('sync.py must be a regular file')
          script = archive.extractfile(member).read()
          compile(script, 'sync.py', 'exec')
          with tempfile.NamedTemporaryFile(dir='/usr/local/lib', delete=False) as tmp:
              tmp.write(script)
          os.chmod(tmp.name, 0o644)
          os.replace(tmp.name, '/usr/local/lib/layr-cloud-sync.py')
          os.execv('/usr/bin/python3', ['python3', '/usr/local/lib/layr-cloud-sync.py', sys.argv[1]])
          EOF
          cat > /etc/systemd/system/layr-executor-sync.service <<'EOF'
          [Unit]
          Description=Layr executor release sync
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=oneshot
          TimeoutStartSec=10min
          ExecStart=/usr/bin/python3 /usr/local/lib/layr-cloud-bootstrap.py /etc/layr-executor/source.json
          EOF
          cat > /etc/systemd/system/layr-executor-sync.timer <<'EOF'
          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=5min
          [Install]
          WantedBy=timers.target
          EOF
          systemctl daemon-reload
          systemctl enable --now layr-executor-sync.timer
          systemctl start layr-executor-sync.service
          cat /etc/layr-executor/machine.json
          if [ '${HostKind}' = runner ]; then
            cat > /usr/local/sbin/layr-runner-tools <<'EOF'
          #!/bin/bash
          set -euo pipefail
          mkdir -p /run/layr-checks
          exec 9>/run/layr-checks/active.lock
          flock -x 9
          export RUSTUP_HOME=/usr/local/share/layr-checks/rustup
          export CARGO_HOME=/usr/local/share/layr-checks/cargo
          export GOPATH=/var/lib/layr/tools/go
          export GOCACHE=/var/lib/layr/tools/go-cache
          mkdir -p /var/lib/layr/tools
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain '${RustToolchain}'
          fi
          "$CARGO_HOME/bin/rustup" toolchain install '${RustToolchain}' --profile minimal
          "$CARGO_HOME/bin/rustup" default '${RustToolchain}'
          for tool in cargo rustc rustdoc rustfmt; do
            ln -sfn "$CARGO_HOME/bin/$tool" "/usr/local/bin/$tool"
          done
          mkdir -p /usr/local/lib/layr-checks /usr/local/share/layr-checks
          CGO_ENABLED=0 GOBIN=/usr/local/lib/layr-checks go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
          ln -sfn /usr/local/lib/layr-checks/minio /usr/local/bin/minio
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          curl -fsSL https://get.helm.sh/helm-v3.22.1-linux-arm64.tar.gz -o "$work/helm.tgz"
          echo '4c29e286b279d170fa048ddfc3e4e83dcd069ca9c52102766ba672d7149e694d  '"$work/helm.tgz" | sha256sum -c -
          tar -xzf "$work/helm.tgz" -C "$work" linux-arm64/helm
          install -m 0755 "$work/linux-arm64/helm" /usr/local/bin/helm
          touch /var/lib/layr/tools/ready
          EOF
            chmod 0755 /usr/local/sbin/layr-runner-tools
            cat > /etc/systemd/system/layr-runner-tools.service <<'EOF'
          [Unit]
          Description=Install the pinned check runner toolchain
          Requires=layr-data.service
          After=layr-data.service network-online.target
          Wants=network-online.target
          ConditionPathExists=!/var/lib/layr/tools/ready
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/layr-runner-tools
          TimeoutStartSec=2h
          [Install]
          WantedBy=multi-user.target
          EOF
            systemctl daemon-reload
            systemctl enable --now layr-runner-idle.timer
            systemctl enable --now layr-runner-tools.service
          fi
Outputs:
  InstanceId:
    Value: !Ref Instance
  RoleArn:
    Value: !GetAtt Role.Arn
  DataVolumeId:
    Value: !Ref DataVolume
